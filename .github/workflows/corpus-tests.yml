# This workflow runs on every pull request to main, but its result does not
# block a merge. Required status checks need a ruleset, and the API refuses to
# create one while this repository is private on the Free plan. The check
# context to require, once the repository is public, is `corpus-tests` — the
# job ID below, so renaming that job disables the future gate.
# Activation runbook and the reasoning for every pin: docs/design/ci.md
name: Corpus verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  corpus-tests:
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.302

      - name: Install private corpus test SDKs
        shell: pwsh
        run: dotnet scripts/install-corpus-test-sdks.cs

      - name: Restore corpus tests
        shell: pwsh
        run: |
          $env:DOTNET_HOST_PATH = (Resolve-Path .artifacts\dotnet\dotnet.exe)
          & $env:DOTNET_HOST_PATH restore tests/DotNetKnowledge.Corpus.Tests/DotNetKnowledge.Corpus.Tests.csproj --nologo

      - name: Verify corpus compilation and runtime behavior
        shell: pwsh
        run: |
          $env:DOTNET_HOST_PATH = (Resolve-Path .artifacts\dotnet\dotnet.exe)
          & $env:DOTNET_HOST_PATH test tests/DotNetKnowledge.Corpus.Tests/DotNetKnowledge.Corpus.Tests.csproj --configuration Release --nologo --no-restore --logger "trx;LogFileName=corpus-tests.trx"

      - name: Test the MCP server
        shell: pwsh
        run: dotnet test tests/DotNetKnowledge.Mcp.Tests/DotNetKnowledge.Mcp.Tests.csproj --configuration Release --nologo --logger "trx;LogFileName=mcp-tests.trx"

      - name: Verify no vendored content
        run: dotnet scripts/verify-no-vendored-content.cs

      - name: Upload corpus test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: corpus-test-results
          path: tests/DotNetKnowledge.Corpus.Tests/TestResults/corpus-tests.trx
